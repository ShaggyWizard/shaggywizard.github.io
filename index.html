<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Планировщик бюджета</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <!-- Sticky блок: настройки + график -->
    <div class="sticky top-0 z-50 bg-white shadow">
      <div class="max-w-7xl mx-auto px-4 py-3 space-y-4">
        <!-- Панель управления -->
        <div class="flex flex-wrap items-center gap-2">
          <input type="date" id="rangeStart" class="border rounded p-2" />
          <input type="date" id="rangeEnd" class="border rounded p-2" />
          <button
            class="px-3 py-1 bg-gray-200 rounded"
            onclick="setRange('week')"
          >
            Неделя
          </button>
          <button
            class="px-3 py-1 bg-gray-200 rounded"
            onclick="setRange('month')"
          >
            Месяц
          </button>
          <button
            class="px-3 py-1 bg-gray-200 rounded"
            onclick="setRange('3m')"
          >
            3 мес
          </button>
          <button
            class="px-3 py-1 bg-gray-200 rounded"
            onclick="setRange('year')"
          >
            Год
          </button>
          <select id="step" class="border rounded p-2">
            <option value="day">День</option>
            <option value="week">Неделя</option>
            <option value="month">Месяц</option>
          </select>
          <button
            class="px-3 py-1 bg-blue-600 text-white rounded"
            onclick="renderTopChart()"
          >
            Показать
          </button>
          <button
            class="px-3 py-1 bg-purple-600 text-white rounded"
            onclick="exportCurrent()"
          >
            Экспорт
          </button>
        </div>
        <!-- График -->
        <div class="h-[300px]">
          <canvas id="topChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Контент -->
    <div class="max-w-7xl mx-auto p-6 space-y-6">
      <!-- Факт -->
      <div class="bg-white shadow rounded p-6">
        <h2 class="text-xl font-semibold mb-4">Фактические операции</h2>
        <form id="factForm" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
          <input type="date" id="factDate" class="border rounded p-2 w-full" />
          <input
            type="text"
            id="factDesc"
            placeholder="Описание"
            class="border rounded p-2 w-full"
            required
          />
          <input
            type="number"
            id="factAmount"
            placeholder="Сумма"
            class="border rounded p-2 w-full"
            required
            step="0.01"
          />
          <select id="factType" class="border rounded p-2 w-full">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
          </select>
          <button
            type="submit"
            class="bg-blue-600 text-white rounded p-2 hover:bg-blue-700"
          >
            Добавить
          </button>
        </form>
        <table class="min-w-full border text-sm">
          <thead class="bg-gray-100">
            <tr>
              <th class="p-2">Дата</th>
              <th class="p-2">Описание</th>
              <th class="p-2">Сумма</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="factTable"></tbody>
        </table>
      </div>

      <!-- План -->
      <div class="bg-white shadow rounded p-6">
        <h2 class="text-xl font-semibold mb-4">Планируемые операции</h2>
        <form id="planForm" class="grid grid-cols-2 md:grid-cols-7 gap-3 mb-4">
          <input type="date" id="planDate" class="border rounded p-2 w-full" />
          <input
            type="text"
            id="planDesc"
            placeholder="Описание"
            class="border rounded p-2 w-full"
            required
          />
          <input
            type="number"
            id="planAmount"
            placeholder="Сумма"
            class="border rounded p-2 w-full"
            required
            step="0.01"
          />
          <select id="planType" class="border rounded p-2 w-full">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
          </select>
          <select id="planRepeat" class="border rounded p-2 w-full">
            <option value="once">Разовый</option>
            <option value="regular">Регулярный</option>
          </select>
          <input
            type="date"
            id="planStart"
            class="border rounded p-2 w-full"
            placeholder="Начало"
          />
          <input
            type="date"
            id="planEnd"
            class="border rounded p-2 w-full"
            placeholder="Конец"
          />
          <button
            type="submit"
            class="bg-green-600 text-white rounded p-2 hover:bg-green-700 col-span-2 md:col-span-7"
          >
            Добавить
          </button>
        </form>
        <table class="min-w-full border text-sm">
          <thead class="bg-gray-100">
            <tr>
              <th class="p-2">Дата/Период</th>
              <th class="p-2">Описание</th>
              <th class="p-2">Сумма</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="planTable"></tbody>
        </table>
      </div>
    </div>

    <script>
      function normalizeData(d) {
        if (!d || typeof d !== "object") d = {};
        if (!Array.isArray(d.fact)) d.fact = [];
        if (!Array.isArray(d.plan)) d.plan = [];
        return d;
      }
      let data = normalizeData(
        JSON.parse(localStorage.getItem("budgetData") || "{}")
      );
      function saveData() {
        localStorage.setItem("budgetData", JSON.stringify(data));
        renderAll();
      }

      function toISO(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${dd}`;
      }
      const TODAY = toISO(new Date());
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("factDate").setAttribute("max", TODAY);
      });

      /* Факт */
      factForm.onsubmit = (e) => {
        e.preventDefault();
        const chosen = factDate.value;
        const dateVal = chosen ? chosen : TODAY;
        if (chosen && chosen > TODAY) {
          alert("Нельзя будущую дату.");
          return;
        }
        data.fact.push({
          date: dateVal,
          desc: factDesc.value,
          amount: parseFloat(factAmount.value).toFixed(2) * 1,
          type: factType.value,
        });
        saveData();
        e.target.reset();
      };

      /* План */
      planForm.onsubmit = (e) => {
        e.preventDefault();
        data.plan.push({
          date: planDate.value,
          desc: planDesc.value,
          amount: parseFloat(planAmount.value).toFixed(2) * 1,
          type: planType.value,
          repeat: planRepeat.value,
          start: planStart.value || null,
          end: planEnd.value || null,
          confirmed: false,
          confirmedMonths: [],
        });
        saveData();
        e.target.reset();
      };

      function confirmPlanOp(index) {
        const op = data.plan[index];
        let fdate = prompt("Дата факта (YYYY-MM-DD):", TODAY);
        if (!fdate) return;
        if (fdate > TODAY) {
          alert("Нельзя будущую дату.");
          return;
        }
        const famount = parseFloat(prompt("Сумма:", op.amount));
        if (isNaN(famount)) return;
        data.fact.push({
          date: fdate,
          desc: op.desc,
          amount: famount,
          type: op.type,
        });
        if (op.repeat === "once") {
          op.confirmed = true;
        } else {
          const ym = fdate.slice(0, 7);
          if (!op.confirmedMonths) op.confirmedMonths = [];
          if (!op.confirmedMonths.includes(ym)) op.confirmedMonths.push(ym);
        }
        saveData();
      }

      function getBalanceSeries(start, end, step) {
        const startDate = new Date(
          start.getFullYear(),
          start.getMonth(),
          start.getDate()
        );
        const endDate = new Date(
          end.getFullYear(),
          end.getMonth(),
          end.getDate()
        );
        const endISO = toISO(endDate);
        const todayISO = TODAY;
        const labels = [],
          actual = [],
          future = [];
        let balFact = 0,
          balPlan = 0,
          idx = 0;

        // стартовый баланс
        data.fact.forEach((op) => {
          if (op.date < toISO(startDate) && op.date <= todayISO) {
            balFact += op.type === "income" ? op.amount : -op.amount;
          }
        });
        data.plan.forEach((op) => {
          if (op.repeat === "once") {
            if (op.date < toISO(startDate) && !op.confirmed) {
              balPlan += op.type === "income" ? op.amount : -op.amount;
            }
          }
          if (op.repeat === "regular") {
            const dayNum = parseInt(op.date.slice(8, 10), 10);
            for (
              let d = new Date(op.start || startDate);
              d < startDate && (!op.end || d <= new Date(op.end));
              d.setMonth(d.getMonth() + 1)
            ) {
              const ds = toISO(new Date(d.getFullYear(), d.getMonth(), dayNum));
              const ym = ds.slice(0, 7);
              if (
                ds < toISO(startDate) &&
                (!op.confirmedMonths || !op.confirmedMonths.includes(ym))
              ) {
                balPlan += op.type === "income" ? op.amount : -op.amount;
              }
            }
          }
        });

        const isWeekBoundary = () => idx % 7 === 6;
        const isMonthBoundary = (cur) => {
          const n = new Date(cur);
          n.setDate(cur.getDate() + 1);
          return cur.getMonth() !== n.getMonth();
        };

        for (
          let cur = new Date(startDate);
          cur <= endDate;
          cur.setDate(cur.getDate() + 1), idx++
        ) {
          const ds = toISO(cur);
          let deltaFact = 0;
          data.fact.forEach((op) => {
            if (op.date === ds && op.date <= todayISO) {
              deltaFact += op.type === "income" ? op.amount : -op.amount;
            }
          });
          balFact += deltaFact;

          let deltaPlan = 0;
          data.plan.forEach((op) => {
            if (op.repeat === "once" && op.date === ds && !op.confirmed) {
              deltaPlan += op.type === "income" ? op.amount : -op.amount;
            }
            if (op.repeat === "regular") {
              const dayNum = parseInt(op.date.slice(8, 10), 10);
              const inRange =
                (!op.start || ds >= op.start) && (!op.end || ds <= op.end);
              const confirmedMonths = op.confirmedMonths || [];
              const ym = ds.slice(0, 7);
              if (
                inRange &&
                cur.getDate() === dayNum &&
                !confirmedMonths.includes(ym)
              ) {
                deltaPlan += op.type === "income" ? op.amount : -op.amount;
              }
            }
          });
          balPlan += deltaPlan;

          let write = false;
          if (step === "day") write = true;
          else if (step === "week") write = isWeekBoundary() || ds === endISO;
          else if (step === "month")
            write = isMonthBoundary(cur) || ds === endISO;

          if (write) {
            labels.push(ds);
            actual.push(balFact);
            future.push(balFact + balPlan);
          }
        }
        return { labels, actual, future };
      }

      function renderTables() {
        factTable.innerHTML = "";
        data.fact.forEach((op, i) => {
          const sign = op.type === "income" ? "+" : "−";
          const cls = op.type === "income" ? "text-green-600" : "text-red-600";
          factTable.innerHTML += `<tr><td class="p-2">${
            op.date
          }</td><td class="p-2">${
            op.desc
          }</td><td class="p-2 ${cls}">${sign}${op.amount.toFixed(
            2
          )}</td><td><button class="text-red-600" onclick="data.fact.splice(${i},1);saveData()">✕</button></td></tr>`;
        });

        planTable.innerHTML = "";
        data.plan.forEach((op, i) => {
          const when =
            op.repeat === "regular"
              ? `${op.start || "∞"}..${op.end || "∞"}`
              : op.date;
          const confirmedTxt = op.repeat === "once" && op.confirmed ? "✓" : "";
          const sign = op.type === "income" ? "+" : "−";
          const cls = op.type === "income" ? "text-green-600" : "text-red-600";
          planTable.innerHTML += `<tr><td class="p-2">${when}</td><td class="p-2">${
            op.desc
          }</td><td class="p-2 ${cls}">${sign}${op.amount.toFixed(
            2
          )}</td><td class="p-2 flex gap-2">${
            confirmedTxt ||
            `<button class="text-green-600" onclick="confirmPlanOp(${i})">Подтвердить</button>`
          }<button class="text-red-600" onclick="data.plan.splice(${i},1);saveData()">Удалить</button></td></tr>`;
        });
      }

      let topChart;
      function renderTopChart() {
        const ctx = document.getElementById("topChart");
        if (topChart instanceof Chart) topChart.destroy();
        const start = new Date(rangeStart.value || new Date());
        const end = new Date(rangeEnd.value || new Date());
        const step = document.getElementById("step").value || "day";
        const s = getBalanceSeries(start, end, step);
        topChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: s.labels,
            datasets: [
              { label: "Факт", data: s.actual, borderColor: "blue" },
              {
                label: "Прогноз",
                data: s.future,
                borderColor: "orange",
                borderDash: [5, 5],
              },
            ],
          },
          options: { maintainAspectRatio: false },
        });
      }

      function setRange(type) {
        const d = new Date();
        const start = new Date(d),
          end = new Date(d);
        if (type === "week") end.setDate(d.getDate() + 7);
        if (type === "month") end.setMonth(d.getMonth() + 1);
        if (type === "3m") end.setMonth(d.getMonth() + 3);
        if (type === "year") end.setFullYear(d.getFullYear() + 1);
        rangeStart.value = toISO(start);
        rangeEnd.value = toISO(end);
      }

      function exportCurrent() {
        const start = new Date(rangeStart.value || new Date());
        const end = new Date(rangeEnd.value || new Date());
        const todayISO = TODAY;
        const rows = [];
        let balFact = 0,
          balPlan = 0;

        // стартовый баланс
        data.fact.forEach((op) => {
          if (op.date < toISO(start) && op.date <= todayISO) {
            balFact += op.type === "income" ? op.amount : -op.amount;
          }
        });
        data.plan.forEach((op) => {
          if (op.repeat === "once") {
            if (op.date < toISO(start) && !op.confirmed) {
              balPlan += op.type === "income" ? op.amount : -op.amount;
            }
          }
          if (op.repeat === "regular") {
            const dayNum = parseInt(op.date.slice(8, 10), 10);
            for (
              let d = new Date(op.start || start);
              d < start && (!op.end || d <= new Date(op.end));
              d.setMonth(d.getMonth() + 1)
            ) {
              const ds = toISO(new Date(d.getFullYear(), d.getMonth(), dayNum));
              const ym = ds.slice(0, 7);
              if (
                ds < toISO(start) &&
                (!op.confirmedMonths || !op.confirmedMonths.includes(ym))
              ) {
                balPlan += op.type === "income" ? op.amount : -op.amount;
              }
            }
          }
        });

        for (
          let cur = new Date(start);
          cur <= end;
          cur.setDate(cur.getDate() + 1)
        ) {
          const ds = toISO(cur);
          const opsFact = [],
            opsPlan = [];
          data.fact.forEach((op) => {
            if (op.date === ds && op.date <= todayISO) {
              const delta = op.type === "income" ? op.amount : -op.amount;
              balFact += delta;
              opsFact.push({ type: op.type, desc: op.desc, amount: op.amount });
            }
          });
          data.plan.forEach((op) => {
            if (op.repeat === "once" && op.date === ds && !op.confirmed) {
              const delta = op.type === "income" ? op.amount : -op.amount;
              balPlan += delta;
              opsPlan.push({ type: op.type, desc: op.desc, amount: op.amount });
            }
            if (op.repeat === "regular") {
              const dayNum = parseInt(op.date.slice(8, 10), 10);
              const inRange =
                (!op.start || ds >= op.start) && (!op.end || ds <= op.end);
              const confirmedMonths = op.confirmedMonths || [];
              const ym = ds.slice(0, 7);
              if (
                inRange &&
                cur.getDate() === dayNum &&
                !confirmedMonths.includes(ym)
              ) {
                const delta = op.type === "income" ? op.amount : -op.amount;
                balPlan += delta;
                opsPlan.push({
                  type: op.type,
                  desc: op.desc,
                  amount: op.amount,
                });
              }
            }
          });
          rows.push({
            date: ds,
            balance_fact: balFact,
            balance_future: balFact + balPlan,
            operations: { fact: opsFact, plan: opsPlan },
          });
        }
        const blob = new Blob([JSON.stringify(rows, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "budget_export.json";
        a.click();
        URL.revokeObjectURL(url);
      }

      function renderAll() {
        renderTables();
        renderTopChart();
      }
      setRange("month");
      renderAll();
    </script>
  </body>
</html>
